<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Book Recommender</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Book Recommender</h1>
    <p>Select your favorite genres:</p>
    <div id="genre-selection">
      <label><input type="checkbox" value="science_fiction" /> Science Fiction</label>
      <label><input type="checkbox" value="fantasy" /> Fantasy</label>
      <label><input type="checkbox" value="mystery" /> Mystery</label>
      <label><input type="checkbox" value="romance" /> Romance</label>
      <label><input type="checkbox" value="history" /> History</label>
      <label><input type="checkbox" value="horror" /> Horror</label>
    </div>
    <button id="get-recommendations">Get Recommendations</button>
  </header>
  <main>
    <section id="recommendations"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
